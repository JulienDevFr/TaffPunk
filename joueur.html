<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAF PUNK — Vote</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 420px; padding-top: 24px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:13px; }
  .score-chip { background:#1E2140; border:1px solid #282C55; border-radius:999px; padding:6px 14px; font-weight:700; color:#34C7A8; }
  .vote-grid { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .vote-btn { padding:18px; border-radius:8px; font-weight:800; font-size:16px; background:#FFB238; color:#14162B; border:none; text-align:center; }
  .vote-btn.eliminated { background:#3A1E2A; color:#FF5D73; text-decoration:line-through; opacity:0.6; }
  .vote-btn.picked { outline:3px solid #F7F3EA; }
  .feedback { text-align:center; font-weight:800; margin:14px 0; }
  .feedback.correct { color:#34C7A8; }
  .feedback.wrong { color:#FF5D73; }
  .reveal-box { text-align:center; padding:30px 0; }
  .reveal-box .who { font-size:28px; font-weight:800; color:#34C7A8; margin:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <span class="dim">Manche <b id="roundLabel">—</b></span>
    <span class="score-chip">Score : <span id="scoreLabel">0</span></span>
  </div>
  <p class="dim" style="text-align:center;">Qui a choisi cette chanson ?</p>
  <div id="gameArea"></div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js';

  const code = new URLSearchParams(window.location.search).get('code');
  const gameArea = document.getElementById('gameArea');

  let userId = null;
  let answeredSubmissionId = null; // évite de re-cliquer sur la même chanson
  let profileCache = {};

  async function usernamesFor(ids) {
    const missing = ids.filter((id) => !profileCache[id]);
    if (missing.length) {
      const { data } = await supabase.from('profiles').select('id, username').in('id', missing);
      (data || []).forEach((p) => { profileCache[p.id] = p.username; });
    }
    return ids.map((id) => profileCache[id] || '…');
  }

  async function init() {
    const { data: userData } = await supabase.auth.getUser();
    if (!userData?.user) { window.location.href = 'index.html'; return; }
    userId = userData.user.id;

    await refreshScore();
    tick();
    setInterval(() => { tick(); refreshScore(); }, 1500);
  }

  async function refreshScore() {
    const { data } = await supabase
      .from('room_members')
      .select('score')
      .eq('room_code', code)
      .eq('user_id', userId)
      .maybeSingle();
    document.getElementById('scoreLabel').textContent = data?.score ?? 0;
  }

  async function tick() {
    const { data: state } = await supabase.rpc('get_current_round_state', { p_room_code: code });
    if (!state) return;

    document.getElementById('roundLabel').textContent = state.round_index;

    if (state.status === 'SOLVED') {
      await renderSolved(state);
      return;
    }
    await renderVoting(state);
  }

  async function renderVoting(state) {
    if (state.submission_id !== answeredSubmissionId) {
      answeredSubmissionId = null; // nouvelle chanson = on peut revoter
    }

    const names = await usernamesFor(state.option_user_ids);
    let html = '<div class="vote-grid">';
    state.option_user_ids.forEach((uid, i) => {
      const isElim = state.eliminated_user_ids.includes(uid);
      const disabled = isElim || answeredSubmissionId === state.submission_id;
      html += `<button class="vote-btn ${isElim ? 'eliminated' : ''}" data-uid="${uid}" ${disabled ? 'disabled' : ''}>${names[i]}</button>`;
    });
    html += '</div><div class="feedback" id="feedback"></div>';
    gameArea.innerHTML = html;

    gameArea.querySelectorAll('.vote-btn:not([disabled])').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const chosenId = btn.dataset.uid;
        answeredSubmissionId = state.submission_id;
        gameArea.querySelectorAll('.vote-btn').forEach((b) => (b.disabled = true));
        btn.classList.add('picked');

        const { data: result } = await supabase.rpc('submit_guess', {
          p_round_id: state.round_id,
          p_chosen_user_id: chosenId,
        });

        const feedback = document.getElementById('feedback');
        if (result?.correct) {
          feedback.className = 'feedback correct';
          feedback.textContent = '✓ Bonne réponse ! +100 pts';
        } else if (result?.ok === false && result?.reason === 'time_up') {
          feedback.className = 'feedback wrong';
          feedback.textContent = 'Trop tard, une nouvelle chanson arrive…';
        } else {
          feedback.className = 'feedback wrong';
          feedback.textContent = 'Mauvaise réponse.';
        }
      });
    });
  }

  async function renderSolved(state) {
    const names = await usernamesFor([state.target_user_id]);
    gameArea.innerHTML = `
      <div class="reveal-box">
        <p class="dim">C'était</p>
        <p class="who">${names[0]}</p>
        <p class="dim">En attente de la prochaine manche…</p>
      </div>
    `;
  }

  init();
</script>
</body>
</html>
